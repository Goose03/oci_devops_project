name: Post-Deploy Health Check & Auto Rollback

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  health-check:
    name: Verify Deployment & Auto Rollback
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      APP_HEALTH_URL: http://140.84.190.22/actuator/health
      DEPLOYMENT_NAME: todolistapp-springboot-deployment
      JIRA_URL:     https://tec-team-kretou7k.atlassian.net
      JIRA_EMAIL:   ${{ secrets.JIRA_EMAIL }}
      JIRA_TOKEN:   ${{ secrets.JIRA_TOKEN }}
      JIRA_PROJECT: SWE

    steps:

      # ── 1. Setup kubectl con tu kubeconfig de OKE ──────────────────────────
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl version --client

      # ── 2. Esperar que OCI DevOps termine de deployar ──────────────────────
      # OCI Build+Deploy tarda ~5-8 min. Esperamos 6 min antes de checar.
      - name: Wait for OCI pipeline to deploy
        run: |
          echo "Esperando 6 minutos para que OCI pipeline complete el deploy..."
          sleep 360

      # ── 3. Verificar que el rollout completó en Kubernetes ─────────────────
      - name: Check Kubernetes rollout status
        id: rollout
        run: |
          echo "Verificando rollout de $DEPLOYMENT_NAME..."
          if kubectl rollout status deployment/$DEPLOYMENT_NAME --timeout=120s; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "✅ Rollout completó exitosamente"
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "❌ Rollout falló o no completó"
          fi

      # ── 4. Health check HTTP contra la app ─────────────────────────────────
      - name: Poll health endpoint
        id: health
        if: steps.rollout.outputs.status == 'success'
        run: |
          echo "Chequeando $APP_HEALTH_URL ..."
          MAX_ATTEMPTS=10
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$APP_HEALTH_URL" || echo "000")
            echo "Intento $ATTEMPT/$MAX_ATTEMPTS — HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "status=healthy" >> $GITHUB_OUTPUT
              echo "✅ App saludable"
              exit 0
            fi
            sleep 30
          done
          echo "status=unhealthy" >> $GITHUB_OUTPUT
          echo "❌ App no responde después de $MAX_ATTEMPTS intentos"

      # ── 5. AUTO ROLLBACK ───────────────────────────────────────────────────
      - name: Auto rollback
        id: rollback
        if: |
          steps.rollout.outputs.status == 'failed' ||
          steps.health.outputs.status == 'unhealthy'
        run: |
          echo "🔄 Iniciando rollback automático..."
          kubectl rollout undo deployment/$DEPLOYMENT_NAME
          echo "Esperando que el rollback complete..."
          kubectl rollout status deployment/$DEPLOYMENT_NAME --timeout=120s

          PREV_VERSION=$(kubectl rollout history deployment/$DEPLOYMENT_NAME | tail -2 | head -1)
          echo "Rollback completado. Versión activa: $PREV_VERSION"
          echo "rolled_back=true" >> $GITHUB_OUTPUT

      # ── 6. Crear ticket Jira si hubo rollback ─────────────────────────────
      - name: Create Jira ticket on rollback
        if: steps.rollback.outputs.rolled_back == 'true'
        run: |
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          python3 - <<EOF
          import os, base64, requests

          jira_url   = os.environ["JIRA_URL"]
          jira_email = os.environ["JIRA_EMAIL"]
          jira_token = os.environ["JIRA_TOKEN"]
          project    = os.environ["JIRA_PROJECT"]

          if not jira_token:
              print("JIRA_TOKEN no configurado — saltando ticket")
              exit(0)

          creds = base64.b64encode(f"{jira_email}:{jira_token}".encode()).decode()
          headers = {
              "Authorization": f"Basic {creds}",
              "Content-Type": "application/json"
          }

          payload = {
              "fields": {
                  "project":   {"key": project},
                  "summary":   f"[AUTO ROLLBACK] Deploy fallido — ${{ github.sha[:7] }}",
                  "issuetype": {"name": "Task"},
                  "description": {
                      "type": "doc", "version": 1,
                      "content": [
                          {"type": "paragraph", "content": [
                              {"type": "text",
                               "text": "Se ejecutó un rollback automático en $TIMESTAMP porque el deploy falló.",
                               "marks": [{"type": "strong"}]}
                          ]},
                          {"type": "paragraph", "content": [
                              {"type": "text", "text": "Commit: ${{ github.sha }}"}
                          ]},
                          {"type": "paragraph", "content": [
                              {"type": "text", "text": "Branch: ${{ github.ref_name }}"}
                          ]},
                          {"type": "paragraph", "content": [
                              {"type": "text", "text": "Autor: ${{ github.actor }}"}
                          ]},
                          {"type": "paragraph", "content": [
                              {"type": "text", "text": "Run: $RUN_URL",
                               "marks": [{"type": "link", "attrs": {"href": "$RUN_URL"}}]}
                          ]},
                      ]
                  }
              }
          }

          r = requests.post(f"{jira_url}/rest/api/3/issue", headers=headers, json=payload, timeout=15)
          if r.status_code == 201:
              print(f"✅ Ticket creado: {r.json().get('key')} — Deploy fallido y rollback ejecutado")
          else:
              print(f"❌ Error Jira {r.status_code}: {r.text[:300]}")
          EOF

      # ── 7. Resumen final ───────────────────────────────────────────────────
      - name: Write summary
        if: always()
        run: |
          ROLLBACK="${{ steps.rollback.outputs.rolled_back }}"
          ROLLOUT="${{ steps.rollout.outputs.status }}"
          HEALTH="${{ steps.health.outputs.status }}"

          if [ "$ROLLBACK" = "true" ]; then
            echo "## 🔄 Deploy FALLIDO — Rollback Ejecutado" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "La versión anterior fue restaurada automáticamente." >> $GITHUB_STEP_SUMMARY
            echo "Se creó un ticket en Jira con los detalles." >> $GITHUB_STEP_SUMMARY
          elif [ "$HEALTH" = "healthy" ]; then
            echo "## ✅ Deploy Exitoso" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "App saludable en $APP_HEALTH_URL" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ Estado desconocido — revisar manualmente" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Autor | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rollout status | $ROLLOUT |" >> $GITHUB_STEP_SUMMARY
          echo "| Health status | $HEALTH |" >> $GITHUB_STEP_SUMMARY
          echo "| Rollback | $ROLLBACK |" >> $GITHUB_STEP_SUMMARY
