apiVersion: v1
kind: Service
metadata:
  name: todolistapp-springboot-service
  annotations:
    oci.oraclecloud.com/loadbalancer-policy: "IP_HASH"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local

  ports:
    - port: 80
      protocol: TCP
      targetPort: 8080
  selector:
    app: todolistapp-springboot
---
#this is new stuff for hosting on the load balancer
apiVersion: v1
kind: Service
metadata:
  name: todolistapp-backend-router
spec:
  selector:
    app: todolistapp-springboot
  ports:
    - protocol: TCP
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolistapp-springboot-deployment
spec:
  selector:
    matchLabels:
      app: todolistapp-springboot
  replicas: 2

  # ── Zero downtime: nunca baja un pod hasta que el nuevo esté listo ──────────
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # puede tener 1 pod extra durante el deploy
      maxUnavailable: 0  # nunca quita un pod antes de que el nuevo pase readiness

  # Guarda los últimos 3 deploys para poder hacer rollback
  revisionHistoryLimit: 3

  # Si el deploy no completa en 5 min, Kubernetes lo marca como FAILED
  progressDeadlineSeconds: 300

  template:
    metadata:
      labels:
        app: todolistapp-springboot
        version: v1
    spec:
      # Tiempo que Kubernetes espera para que el pod termine conexiones activas
      terminationGracePeriodSeconds: 30

      containers:
        - name: todolistapp-springboot
          image: %DOCKER_REGISTRY%/todolistapp-springboot:%IMAGE_VERSION%
          imagePullPolicy: Always
          env:
            - name: db_user
              value: "CHATBOT_USER"
            - name: db_url
              value: "jdbc:oracle:thin:@rv9chxphs7jysz5z_high?TNS_ADMIN=/mtdrworkshop/creds"
            - name: todo.table.name
              value: "todoitem"
            - name: driver_class_name
              value: "oracle.jdbc.OracleDriver"
            - name: OCI_REGION
              value: "%OCI_REGION%"
            - name: dbpassword
              valueFrom:
                secretKeyRef:
                  name: dbuser
                  key: dbpassword
                  optional: true
            - name: ui_username
              value: "%UI_USERNAME%"
            - name: ui_password
              valueFrom:
                secretKeyRef:
                  name: frontendadmin
                  key: password
                  optional: true
          volumeMounts:
            - name: creds
              mountPath: /mtdrworkshop/creds
          ports:
            - containerPort: 8080
              name: http

          # ── Readiness probe ─────────────────────────────────────────────────
          # Kubernetes NO envía tráfico hasta que este check pase.
          # Durante el rolling update, el pod viejo sigue activo hasta que
          # el nuevo pase este check — garantiza zero downtime.
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30   # Spring Boot tarda ~20-30s en arrancar
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1

          # ── Liveness probe ──────────────────────────────────────────────────
          # Si este check falla 3 veces seguidas, Kubernetes reinicia el pod.
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60   # espera más que readiness para no matar al arrancar
            periodSeconds: 15
            failureThreshold: 3

          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"

      restartPolicy: Always
      volumes:
        - name: creds
          secret:
            secretName: db-wallet-secret
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: todolistapp-springboot
---
